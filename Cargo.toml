[package]
name = "brainium"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
fast_hilbert = "2.1.0"
pixels = "0.17.2"
shared_memory = "0.12.4"
winit = "0.30.13"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
# arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
